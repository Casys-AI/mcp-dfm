name: Reusable quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fast:
    name: Fast quality checks
    runs-on: ubuntu-latest
    env:
      MCP_VIEW_LOCAL_ROOT: ${{ github.workspace }}/.build/mcp-server/packages/view
      MCP_VIEW_CONTRACTS_LOCAL_ROOT: ${{ github.workspace }}/.build/mcp-server/packages/view-contracts
      MCP_VIEW_COMPONENTS_LOCAL_ROOT: ${{ github.workspace }}/.build/mcp-server/packages/view-components
    steps:
      - uses: actions/checkout@v5

      - name: Check out exact MCP View build sources
        uses: actions/checkout@v5
        with:
          repository: Casys-AI/mcp-server
          ref: b08802df353bb25d25a1c8d64b22ea61b5287ae0
          path: .build/mcp-server
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run fast quality checks
        run: deno task release:check

  native:
    name: Native DFM integration checks
    runs-on: ubuntu-latest
    env:
      MCP_VIEW_LOCAL_ROOT: ${{ github.workspace }}/.build/mcp-server/packages/view
      MCP_VIEW_CONTRACTS_LOCAL_ROOT: ${{ github.workspace }}/.build/mcp-server/packages/view-contracts
      MCP_VIEW_COMPONENTS_LOCAL_ROOT: ${{ github.workspace }}/.build/mcp-server/packages/view-components
    steps:
      - uses: actions/checkout@v5

      - name: Check out exact MCP View build sources
        uses: actions/checkout@v5
        with:
          repository: Casys-AI/mcp-server
          ref: b08802df353bb25d25a1c8d64b22ea61b5287ae0
          path: .build/mcp-server
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install native DFM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gmsh python3 python3-numpy

      - name: Log native tool versions
        run: |
          deno --version
          gmsh --version
          python3 --version
          python3 -c 'import numpy; print(numpy.__version__)'

      - name: Run native integration checks
        run: DFM_RUN_NATIVE=1 deno task test
