name: Reusable quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  fast:
    name: Fast quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run fast quality checks
        run: deno task release:check

  native:
    name: Native DFM integration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install native DFM dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gmsh python3 python3-numpy

      - name: Log native tool versions
        run: |
          deno --version
          gmsh --version
          python3 --version
          python3 -c 'import numpy; print(numpy.__version__)'

      - name: Run native integration checks
        run: DFM_RUN_NATIVE=1 deno task test
